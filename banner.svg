<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="C# Learning Path">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a22"/>
      <stop offset="0.55" stop-color="#241660"/>
      <stop offset="1" stop-color="#512BD4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#9b7bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9b7bff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="typed"><rect x="100" y="205" width="504" height="52">
      <animate attributeName="width" values="0;504;504;0" keyTimes="0;0.4;0.85;1" dur="9s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <text x="905" y="235" font-family="Consolas, Menlo, monospace" font-size="190" fill="#ffffff" opacity="0.07">{ }
    <animate attributeName="opacity" values="0.05;0.11;0.05" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="640" y="120" font-family="Consolas, Menlo, monospace" font-size="34" fill="#ffffff" opacity="0.10">{ }<animate attributeName="y" values="330;-30" dur="11s" begin="0s" repeatCount="indefinite"/></text>
<text x="760" y="120" font-family="Consolas, Menlo, monospace" font-size="30" fill="#ffffff" opacity="0.10">=&gt;<animate attributeName="y" values="330;-30" dur="14s" begin="3s" repeatCount="indefinite"/></text>
<text x="880" y="120" font-family="Consolas, Menlo, monospace" font-size="32" fill="#ffffff" opacity="0.10">&lt;T&gt;<animate attributeName="y" values="330;-30" dur="12s" begin="6s" repeatCount="indefinite"/></text>
<text x="1000" y="120" font-family="Consolas, Menlo, monospace" font-size="34" fill="#ffffff" opacity="0.10">[]<animate attributeName="y" values="330;-30" dur="15s" begin="1s" repeatCount="indefinite"/></text>
<text x="1090" y="120" font-family="Consolas, Menlo, monospace" font-size="24" fill="#ffffff" opacity="0.10">async<animate attributeName="y" values="330;-30" dur="13s" begin="8s" repeatCount="indefinite"/></text>
<text x="560" y="120" font-family="Consolas, Menlo, monospace" font-size="24" fill="#ffffff" opacity="0.10">LINQ<animate attributeName="y" values="330;-30" dur="16s" begin="5s" repeatCount="indefinite"/></text>
<text x="950" y="120" font-family="Consolas, Menlo, monospace" font-size="24" fill="#ffffff" opacity="0.10">class<animate attributeName="y" values="330;-30" dur="17s" begin="10s" repeatCount="indefinite"/></text>
<text x="700" y="120" font-family="Consolas, Menlo, monospace" font-size="22" fill="#ffffff" opacity="0.10">0x1F<animate attributeName="y" values="330;-30" dur="13s" begin="9s" repeatCount="indefinite"/></text>
